name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      # Placeholders only: the build needs the variables to exist, not a real project.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Keep in sync with the `supabase` devDependency in package.json
          version: 3.2.0
      - run: supabase start
      - run: npm run test:db
